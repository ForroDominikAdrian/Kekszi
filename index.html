<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Kekszi - Bejelentkezés & Regisztráció</title>
    <link rel="stylesheet" href="indexstyle.css">
</head>
<body>

    <header class="d-flex align-items-center justify-content-between px-4" id="tetejere">
        <div class="d-flex align-items-center">
            <a href="rolunk.html"><img src="Kepek/Kekszi.png" alt="Logo" width="100" class="me-3"></a>
            <nav class="d-flex gap-2">
                <a href="rolunk.html" class="btn btn-custom">Rólunk</a>
                <a href="services.html" class="btn btn-custom">Szolgáltatásaink</a>
                <a href="https://milan0419.github.io/tictactoehtml/multi/index.html" class="btn btn-custom">Polibix</a>
            </nav>
        </div>

        <!-- Bejelentkezett fiók állapota -->
        <div id="userHeader" class="d-flex align-items-center"></div>
    </header>

    <section class="kontakt">
        <div class="kontakt-container">
            
            <ul class="nav nav-pills nav-justified mb-4" id="authTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">Bejelentkezés</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button" role="tab">Regisztráció</button>
                </li>
            </ul>

            <div class="tab-content" id="authTabContent">
                
                <!-- BEJELENTKEZÉS -->
                <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="loginEmail">E-mail cím</label>
                            <input type="email" id="loginEmail" placeholder="pelda@email.hu" required>
                        </div>
                        <div class="form-group">
                            <label for="loginJelszo">Jelszó</label>
                            <input type="password" id="loginJelszo" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-submit">Bejelentkezés</button>
                    </form>
                </div>

                <!-- REGISZTRÁCIÓ -->
                <div class="tab-pane fade" id="register-pane" role="tabpanel">
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="regNev">Teljes név</label>
                            <input type="text" id="regNev" placeholder="Minta János" required>
                        </div>
                        <div class="form-group">
                            <label for="regEmail">E-mail cím</label>
                            <input type="email" id="regEmail" placeholder="pelda@email.hu" required>
                        </div>
                        <div class="form-group">
                            <label for="regJelszo">Jelszó</label>
                            <input type="password" id="regJelszo" placeholder="••••••••" minlength="6" required>
                        </div>
                        <div class="form-group">
                            <label for="regJelszo2">Jelszó újra</label>
                            <input type="password" id="regJelszo2" placeholder="••••••••" minlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-submit">Regisztráció</button>
                    </form>
                </div>

            </div>

            <div id="authUzenet" class="mt-3 d-none"></div>
        </div>
    </section>

    <footer class="lablec">
        <p>Készítette: Bálint Milán · Forró Dominik · 2026</p>
        <p><a href="#tetejere" class="btn btn-custom">Vissza a lap tetejére</a></p>
        <p class="apro">Iskolai gyakorlófeladat.</p>
    </footer>

    <script>
        const uzenetDiv = document.getElementById('authUzenet');

        function showMessage(text, isSuccess) {
            uzenetDiv.classList.remove('d-none', 'alert-danger', 'alert-success');
            uzenetDiv.classList.add('alert', isSuccess ? 'alert-success' : 'alert-danger');
            uzenetDiv.textContent = text;
        }

        // Fejléc frissítése (Szia, Név!)
        function renderHeader() {
            const userHeader = document.getElementById('userHeader');
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));

            if (currentUser) {
                userHeader.innerHTML = `
                    <span class="me-3 fw-bold" style="color: #3d2314; font-size: 15px;">
                        Szia, ${currentUser.name}!
                    </span>
                    <button id="logoutBtn" class="btn btn-custom" style="padding: 6px 12px; font-size: 13px;">
                        Kijelentkezés
                    </button>
                `;

                document.getElementById('logoutBtn').addEventListener('click', function() {
                    localStorage.removeItem('currentUser');
                    renderHeader();
                });
            } else {
                userHeader.innerHTML = '';
            }
        }

        renderHeader();

        // REGISZTRÁCIÓ KÜLDÉSE A PHP-NAK
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const nev = document.getElementById('regNev').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const jelszo = document.getElementById('regJelszo').value;
            const jelszo2 = document.getElementById('regJelszo2').value;

            if (jelszo !== jelszo2) {
                showMessage('A megadott jelszavak nem egyeznek!', false);
                return;
            }

            try {
                const response = await fetch('regisztral.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: nev, email: email, password: jelszo })
                });

                const result = await response.json();
                showMessage(result.message, result.success);

                if (result.success) {
                    document.getElementById('registerForm').reset();
                    setTimeout(() => {
                        const loginTab = new bootstrap.Tab(document.getElementById('login-tab'));
                        loginTab.show();
                        document.getElementById('loginEmail').value = email;
                    }, 1500);
                }
            } catch (err) {
                showMessage('Szerverhiba történt! (Fut a PHP webszerver?)', false);
            }
        });

        // BEJELENTKEZÉS KÜLDÉSE A PHP-NAK
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const jelszo = document.getElementById('loginJelszo').value;

            try {
                const response = await fetch('bejelentkez.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: jelszo })
                });

                const result = await response.json();
                showMessage(result.message, result.success);

                if (result.success) {
                    localStorage.setItem('currentUser', JSON.stringify(result.user));
                    renderHeader();

                    setTimeout(() => {
                        window.location.href = 'rolunk.html';
                    }, 1500);
                }
            } catch (err) {
                showMessage('Szerverhiba történt! (Fut a PHP webszerver?)', false);
            }
        });
    </script>
</body>
</html>
